name: Build iOS IPA
on:
  workflow_dispatch:
  push:
    branches:
      - ios-release

jobs:
  build_ios:
    name: Build Unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_TMDB_API_KEY: ${{ secrets.EXPO_PUBLIC_TMDB_API_KEY }}
      EXPO_PUBLIC_TRAKT_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_TRAKT_CLIENT_ID }}
      EXPO_PUBLIC_TRAKT_CLIENT_SECRET: ${{ secrets.EXPO_PUBLIC_TRAKT_CLIENT_SECRET }}
      REQUIRED_EXPO_PUBLIC_VARS: EXPO_PUBLIC_SUPABASE_URL,EXPO_PUBLIC_SUPABASE_ANON_KEY

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup CocoaPods
        uses: maxim-lobanov/setup-cocoapods@v1
        with:
          version: 1.16.2

      - name: Install xcpretty
        run: gem install xcpretty

      - name: Install dependencies
        run: npm ci

      - name: Validate required Expo env vars
        run: node ./scripts/validate-required-env.js

      - name: Prebuild iOS
        run: npx expo prebuild -p ios --clean

      - name: Install Pods
        run: |
          cd ios
          pod install

      - name: Build Archive (Unsigned)
        run: |
          cd ios
          set -o pipefail
          xcodebuild archive \
            -workspace Crispy.xcworkspace \
            -scheme Crispy \
            -configuration Release \
            -archivePath ../build/crispynative.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            SHOW_S_ENV=NO | xcpretty

      - name: Package IPA
        run: |
          mkdir -p Payload
          mv build/crispynative.xcarchive/Products/Applications/Crispy.app Payload/
          zip -r crispynative-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: crispynative-unsigned-ipa
          path: crispynative-unsigned.ipa
