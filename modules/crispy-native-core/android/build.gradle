apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
  compileSdkVersion project.findProperty('compileSdkVersion') ?: 35
  namespace "aayush.crispy.core"

  defaultConfig {
    minSdkVersion project.findProperty('minSdkVersion') ?: 24
    targetSdkVersion project.findProperty('targetSdkVersion') ?: 35
    versionCode 1
    versionName "1.0"
  }

  lintOptions {
    abortOnError false
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }
}

dependencies {
  implementation project(':expo-modules-core')

  // React Native bridge (for LifecycleEventListener, ReactContext)
  implementation "com.facebook.react:react-android"

  // Core KTX for WindowCompat/WindowInsetsControllerCompat
  implementation "androidx.core:core-ktx:1.12.0"

  // VLC Player library
  implementation "org.videolan.android:libvlc-all:3.6.0"
  
  // jlibtorrent - Mavenized for production (Fixes W^X security warnings and Android 15 compatibility)
  def jlibtorrent_version = '2.0.13.6'
  implementation "com.frostwire:jlibtorrent:${jlibtorrent_version}"
  implementation "com.frostwire:jlibtorrent-android-arm:${jlibtorrent_version}"
  implementation "com.frostwire:jlibtorrent-android-arm64:${jlibtorrent_version}"
  implementation "com.frostwire:jlibtorrent-android-x86:${jlibtorrent_version}"
  implementation "com.frostwire:jlibtorrent-android-x86_64:${jlibtorrent_version}"
  
  // NanoHTTPD for local HTTP streaming server
  implementation 'org.nanohttpd:nanohttpd:2.3.1'
  implementation "androidx.media:media:1.7.0"
  
  // Lifecycle & Coroutines
  implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.7.0"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"

  // Material 3 Components
  implementation "com.google.android.material:material:1.14.0-alpha01"

  // Media3 for Player integration and Notifications
  implementation "androidx.media3:media3-common:1.2.1"
  implementation "androidx.media3:media3-exoplayer:1.2.1"
  implementation "androidx.media3:media3-exoplayer-hls:1.2.1"
  implementation "androidx.media3:media3-exoplayer-dash:1.2.1"
  implementation "androidx.media3:media3-datasource:1.2.1"
  implementation "androidx.media3:media3-ui:1.2.1"
  implementation "androidx.media3:media3-session:1.2.1"

  // Coil for image loading in notifications
  implementation "io.coil-kt:coil:2.6.0"
}

repositories {
  maven {
    url "https://dl.frostwire.com/maven"
    content {
      includeGroup "com.frostwire"
    }
  }
}
